function chip(ok, sí = 'Cumple', no = 'No cumple') {
  return ok ? `<span class="chip ok">✓ ${sí}</span>` : `<span class="chip ko">✕ ${no}</span>`;
}

// ---------- gráficas SVG ----------
function escalaBonita(max) {
  if (max <= 0) return { max: 1, paso: .25 };
  const bruto = max / 4, mag = Math.pow(10, Math.floor(Math.log10(bruto)));
  const paso = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((p) => p >= bruto);
  return { max: Math.ceil(max / paso) * paso, paso };
}

function lineas(cont, series, op) {
  series = series.filter((s) => s.pts.length);
  if (!series.length) { cont.innerHTML = '<p class="vacio">Sin datos.</p>'; return; }
  const s2 = op.y2 ? op.y2.series.filter((s) => s.pts.length) : [];
  const W = Math.max(cont.clientWidth, 300), H = op.alto || 240, m = { t: op.marcas ? 22 : 10, r: s2.length ? 46 : 14, b: 34, l: 52 };
  const xs = series.flatMap((s) => s.pts.map((p) => p[0])), ys = series.flatMap((s) => s.pts.map((p) => p[1]));
  const xs2 = s2.flatMap((s) => s.pts.map((p) => p[0]));
  const x0 = Math.min(...xs, ...xs2), x1 = Math.max(...xs, ...xs2) || 1;
  const ey = escalaBonita(Math.max(...ys, op.minY || 0));
  const X = (v) => m.l + (x1 === x0 ? 0 : (v - x0) / (x1 - x0)) * (W - m.l - m.r);
  const Y = (v) => H - m.b - (v / ey.max) * (H - m.t - m.b);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(op.titulo || '')}">`;
  for (let v = 0; v <= ey.max + 1e-9; v += ey.paso) {
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/>`;
    svg += `<text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text-muted)">${op.yFmt ? op.yFmt(v) : f(v, ey.paso < 1 ? 1 : 0)}</text>`;
  }
  const nx = 6;
  for (let i = 0; i <= nx; i++) {
    const v = x0 + (x1 - x0) * i / nx;
    svg += `<text x="${X(v)}" y="${H - m.b + 16}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${op.xFmt ? op.xFmt(v) : f(v, 0)}</text>`;
  }
  svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="var(--text-muted)"/>`;
  if (op.xTitulo) svg += `<text x="${(W + m.l) / 2}" y="${H - 2}" text-anchor="middle" font-size="11" fill="var(--text-secondary)">${op.xTitulo}</text>`;
  if (op.yTitulo) svg += `<text transform="translate(12 ${(H - m.b) / 2}) rotate(-90)" text-anchor="middle" font-size="11" fill="var(--text-secondary)">${op.yTitulo}</text>`;
  if (op.umbral && op.umbral <= ey.max) {
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(op.umbral)}" y2="${Y(op.umbral)}" stroke="var(--critical)" stroke-dasharray="4 4"/>`;
    svg += `<text x="${W - m.r}" y="${Y(op.umbral) - 4}" text-anchor="end" font-size="11" fill="var(--text-secondary)">umbral ${f(op.umbral, 0)} ${op.umbralTxt || 'ms'}</text>`;
  }
  series.forEach((s) => {
    const d = s.pts.map((p, i) => `${i ? 'L' : 'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('');
    svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  let Y2 = null;
  if (s2.length) {
    const ey2 = escalaBonita(Math.max(...s2.flatMap((s) => s.pts.map((p) => p[1])), op.y2.minY || 0));
    Y2 = (v) => H - m.b - (v / ey2.max) * (H - m.t - m.b);
    for (let v = 0; v <= ey2.max + 1e-9; v += ey2.paso) {
      if (op.y2.enteros && v % 1) continue;
      svg += `<text x="${W - m.r + 6}" y="${Y2(v) + 4}" font-size="11" fill="var(--text-muted)">${f(v, 0)}</text>`;
    }
    if (op.y2.titulo) svg += `<text transform="translate(${W - 4} ${(H - m.b) / 2}) rotate(90)" text-anchor="middle" font-size="11" fill="var(--text-secondary)">${op.y2.titulo}</text>`;
    s2.forEach((s) => {   // escalones: el valor se mantiene hasta la siguiente lectura
      let d = '';
      s.pts.forEach((p, i) => { d += i ? `H${X(p[0]).toFixed(1)}V${Y2(p[1]).toFixed(1)}` : `M${X(p[0]).toFixed(1)},${Y2(p[1]).toFixed(1)}`; });
      svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-dasharray="${s.guion || ''}" opacity=".9"/>`;
    });
  }
  (op.marcas || []).forEach((mk) => {
    if (mk.x < x0 || mk.x > x1) return;
    svg += `<line x1="${X(mk.x)}" x2="${X(mk.x)}" y1="${m.t}" y2="${H - m.b}" stroke="var(--text-secondary)" stroke-dasharray="2 3"/>`;
    svg += `<text x="${X(mk.x) + 3}" y="${m.t - 6}" font-size="10.5" fill="var(--text-secondary)">${esc(mk.texto)}</text>`;
  });
  svg += `<line class="cruz" y1="${m.t}" y2="${H - m.b}" stroke="var(--text-muted)" stroke-dasharray="3 3" visibility="hidden"/>`;
  svg += `<g class="puntos"></g><rect x="${m.l}" y="${m.t}" width="${W - m.l - m.r}" height="${H - m.t - m.b}" fill="transparent"/></svg>`;
  cont.innerHTML = svg + '<div class="tip"></div>';
  const el = cont.querySelector('svg'), tip = cont.querySelector('.tip'), cruz = el.querySelector('.cruz'), g = el.querySelector('.puntos');
  const todosX = [...new Set(xs.length ? xs : xs2)].sort((a, b) => a - b);
  const mover = (ev) => {
    const r = el.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
    const vx = x0 + (px - m.l) / (W - m.l - m.r) * (x1 - x0);
    const cerca = todosX.reduce((a, b) => Math.abs(b - vx) < Math.abs(a - vx) ? b : a);
    cruz.setAttribute('x1', X(cerca)); cruz.setAttribute('x2', X(cerca)); cruz.setAttribute('visibility', 'visible');
    let filas = '', pts = '';
    series.forEach((s) => {
      const p = s.pts.find((q) => q[0] === cerca);
      if (!p) return;
      filas += `<div><i style="background:${s.color}"></i>${esc(s.name)}: <b style="display:inline">${op.vFmt ? op.vFmt(p[1]) : f(p[1], 1)}</b></div>`;
      pts += `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="${s.color}" stroke="var(--surface-1)" stroke-width="2"/>`;
    });
    s2.forEach((s) => {
      const previos = s.pts.filter((q) => q[0] <= cerca);
      const p = previos.length ? previos[previos.length - 1] : null;
      if (!p) return;
      filas += `<div><i style="background:${s.color}"></i>${esc(s.name)}: <b style="display:inline">${f(p[1], 0)}</b></div>`;
    });
    g.innerHTML = pts;
    tip.innerHTML = `<b>${op.tipX ? op.tipX(cerca) : op.xFmt ? op.xFmt(cerca) : cerca}</b>${filas}`;
    tip.style.display = 'block';
    const izq = X(cerca) * r.width / W;
    tip.style.left = Math.min(Math.max(izq + 12, 0), r.width - tip.offsetWidth) + 'px';
    tip.style.top = '6px';
  };
  el.addEventListener('mousemove', mover);
  el.addEventListener('mouseleave', () => { tip.style.display = 'none'; cruz.setAttribute('visibility', 'hidden'); g.innerHTML = ''; });
}

function barras(cont, datos, op) {
  const W = Math.max(cont.clientWidth, 300), H = 240, m = { t: 10, r: 14, b: 34, l: 52 };
  const ey = escalaBonita(Math.max(...datos.map((d) => d[1]), op.minY || 0, (op.umbral || 0) * 1.1));
  const n = datos.length, banda = (W - m.l - m.r) / n, ancho = Math.max(1, banda - 2);
  const Y = (v) => H - m.b - (v / ey.max) * (H - m.t - m.b);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(op.titulo || '')}">`;
  for (let v = 0; v <= ey.max + 1e-9; v += ey.paso) {
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/>`;
    svg += `<text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--text-muted)">${op.yFmt ? op.yFmt(v) : f(v, ey.paso < 1 ? 1 : 0)}</text>`;
  }
  const cada = op.cada || Math.ceil(n / 8);
  datos.forEach((d, i) => {
    const x = m.l + i * banda + 1, h = H - m.b - Y(d[1]);
    const r = Math.min(4, ancho / 2, h);
    if (h > 0) svg += `<path d="M${x},${H - m.b}V${Y(d[1]) + r}q0,-${r} ${r},-${r}h${ancho - 2 * r}q${r},0 ${r},${r}V${H - m.b}Z" fill="${d[3] ? `var(--${d[3]})` : (op.color || color(0))}"/>`;
    if (op.umbral !== undefined) {}
    if (op.etiqueta) { if (d[4]) svg += `<text x="${x + banda}" y="${H - m.b + 16}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${esc(d[4])}</text>`; }
    else if (i % cada === 0) svg += `<text x="${x + ancho / 2}" y="${H - m.b + 16}" text-anchor="middle" font-size="11" fill="var(--text-muted)">${op.xFmt ? op.xFmt(d[0]) : d[0]}</text>`;
    svg += `<rect class="hit" data-i="${i}" x="${m.l + i * banda}" y="${m.t}" width="${banda}" height="${H - m.t - m.b}" fill="transparent"/>`;
  });
  if (op.umbral && op.umbral <= ey.max) {
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(op.umbral)}" y2="${Y(op.umbral)}" stroke="var(--critical)" stroke-dasharray="4 4"/>`;
    svg += `<text x="${W - m.r}" y="${Y(op.umbral) - 4}" text-anchor="end" font-size="11" fill="var(--text-secondary)">umbral ${op.umbral} ms</text>`;
  }
  svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="var(--text-muted)"/>`;
  if (op.xTitulo) svg += `<text x="${(W + m.l) / 2}" y="${H - 2}" text-anchor="middle" font-size="11" fill="var(--text-secondary)">${op.xTitulo}</text>`;
  if (op.yTitulo) svg += `<text transform="translate(12 ${(H - m.b) / 2}) rotate(-90)" text-anchor="middle" font-size="11" fill="var(--text-secondary)">${op.yTitulo}</text>`;
  cont.innerHTML = svg + '</svg><div class="tip"></div>';
  const el = cont.querySelector('svg'), tip = cont.querySelector('.tip');
  el.querySelectorAll('.hit').forEach((h) => {
    h.addEventListener('mousemove', (ev) => {
      const d = datos[+h.dataset.i], r = el.getBoundingClientRect();
      tip.innerHTML = op.tip(d); tip.style.display = 'block';
      tip.style.left = Math.min(ev.clientX - r.left + 12, r.width - tip.offsetWidth) + 'px'; tip.style.top = '6px';
    });
    h.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  });
}

function leyenda(series) {
  if (series.length < 2 && !(series[0] && series[0].siempre)) return '';
  return `<div class="leyenda">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}

// ---------- vistas ----------
let dibujos = [];
function graf(id, titulo, desc, series, tipo, op) {
  dibujos.push(() => tipo === 'barras' ? barras(document.getElementById(id), series, op) : lineas(document.getElementById(id), series, op));
  const ley = tipo === 'barras' ? '' : leyenda(op && op.y2 ? [...series, ...op.y2.series].map((s) => ({ ...s, siempre: true })) : series);
  return `<div class="card graf${op && op.ancho ? ' ancho' : ''}"><h4>${titulo}</h4><p>${desc}</p>${ley}<div class="lienzo" id="${id}"></div></div>`;
}
function conColor(series) { return ordenar(series).map((s, i) => ({ ...s, color: color(i) })); }

function vistaResumen() {
  const ag = D.agregado;
  let h = `<h2>Resumen de las corridas</h2><p class="sub-t">${D.corridas.length} corridas · umbrales: p95 &lt; ${U.p95} ms, p99 &lt; ${U.p99} ms, errores &lt; ${U.err} % · APDEX con T = ${U.apdexT} ms y F = ${U.apdexF} ms</p>`;
  h += `<h3>Por escenario y perfil (media ± desviación estándar entre corridas)</h3><div class="tabla-wrap"><table><thead><tr>
    <th>Escenario</th><th>Perfil</th><th class="n">Corridas</th><th class="n">Promedio (ms)</th><th class="n">p95 (ms)</th><th class="n">p99 (ms)</th>
    <th class="n">Errores (%)</th><th class="n">Throughput (req/s)</th><th class="n">APDEX</th><th>Umbrales</th></tr></thead><tbody>`;
  ag.forEach((a) => {
    h += `<tr><td>${esc(a.escenario)}</td><td>${NOMBRE_PERFIL[a.perfil] || a.perfil}</td><td class="n">${a.corridas}</td>
      <td class="n">${f(a.avg, 1)} ± ${f(a.avg_sd, 1)}</td><td class="n">${f(a.p95, 1)} ± ${f(a.p95_sd, 1)}</td><td class="n">${f(a.p99, 1)} ± ${f(a.p99_sd, 1)}</td>
      <td class="n">${f(a.err)} ± ${f(a.err_sd)}</td><td class="n">${f(a.tps)} ± ${f(a.tps_sd)}</td><td class="n">${f(a.apdex, 3)}</td>
      <td>${chip(cumple(a))}</td></tr>`;
  });
  h += '</tbody></table></div>';
  const bar = ag.map((a) => [`${a.escenario.slice(0, 2)} ${NOMBRE_PERFIL[a.perfil] || a.perfil}`, a.p95, a]);
  h += `<div class="graficas" style="margin-top:16px">${graf('g-res-p95', 'p95 medio por escenario y perfil', 'La línea punteada es el umbral de aceptación.', bar, 'barras',
    { umbral: U.p95, yTitulo: 'ms', titulo: 'p95 medio', tip: (d) => `<b>${esc(d[2].escenario)} · ${NOMBRE_PERFIL[d[2].perfil] || d[2].perfil}</b>p95: ${f(d[1], 1)} ms ± ${f(d[2].p95_sd, 1)}` })}
    ${graf('g-res-tps', 'Throughput medio por escenario y perfil', 'Solicitudes por segundo procesadas durante la prueba.', ag.map((a) => [`${a.escenario.slice(0, 2)} ${NOMBRE_PERFIL[a.perfil] || a.perfil}`, a.tps, a]), 'barras',
    { yTitulo: 'req/s', titulo: 'throughput', tip: (d) => `<b>${esc(d[2].escenario)} · ${NOMBRE_PERFIL[d[2].perfil] || d[2].perfil}</b>${f(d[1])} req/s ± ${f(d[2].tps_sd)}` })}</div>`;
  h += `<h3>Todas las corridas</h3><div class="tabla-wrap"><table><thead><tr><th>Corrida</th><th>Inicio (UTC)</th><th class="n">VUs máx.</th><th class="n">Solicitudes</th>
    <th class="n">Errores (%)</th><th class="n">Promedio (ms)</th><th class="n">p95 (ms)</th><th class="n">p99 (ms)</th><th class="n">Throughput (req/s)</th><th>Umbrales</th></tr></thead><tbody>`;
  D.corridas.forEach((c) => {
    const t = c.total;
    h += `<tr><td><a href="#${c.id}">${esc(c.escenario)} · ${NOMBRE_PERFIL[c.perfil] || c.perfil} · ${esc(c.corrida)}</a></td><td>${esc(c.inicio)}</td><td class="n">${c.vus_max}</td>
      <td class="n">${t.n}</td><td class="n">${f(t.err)}</td><td class="n">${f(t.avg, 1)}</td><td class="n">${f(t.p95, 1)}</td><td class="n">${f(t.p99, 1)}</td>
      <td class="n">${f(t.tps)}</td><td>${chip(cumple(t))}</td></tr>`;
  });
  return h + '</tbody></table></div>';
}

function vistaCorrida(c) {
  const t = c.total, xFmt = reloj, ms = (v) => fms(v) + ' ms';
  let h = `<h2>${esc(c.titulo)}</h2><p class="sub-t">Perfil ${NOMBRE_PERFIL[c.perfil] || c.perfil} · ${esc(c.corrida)} · ${chip(cumple(t), 'Cumple los umbrales', 'Incumple algún umbral')}</p>`;

    <div class="kpi"><div class="v">${fms(t.avg)}</div><div class="l">Promedio (ms)</div></div>

  h += `<h3>Información de la prueba</h3><div class="tabla-wrap"><table class="info"><tbody>

    <tr><th>Usuarios virtuales máx.</th><td>${c.vus_max}</td></tr>

    ${c.mig && c.mig.politica ? filasPolitica(c.mig.politica) : ''}</tbody></table></div>`;

  h += `<h3>APDEX (Application Performance Index)</h3><div class="tabla-wrap"><table><thead><tr><th class="n">APDEX</th><th class="n">T (tolerancia)</th><th class="n">F (frustración)</th><th>Etiqueta</th><th>Calificación</th></tr></thead><tbody>`;
  [t, ...ordenar(c.tabla.map((x) => ({ ...x, name: x.label })))].forEach((x) => {
    h += `<tr class="${x.label === 'Total' ? 'total' : ''}"><td class="n">${f(x.apdex, 3)}</td><td class="n">${U.apdexT} ms</td><td class="n">${U.apdexF} ms</td><td class="mono">${esc(x.label)}</td><td>${apdexTexto(x.apdex)}</td></tr>`;
  });
  h += '</tbody></table></div><p class="nota">APDEX = (satisfechas + tolerables / 2) / total. Satisfecha: ≤ T y sin error; tolerable: entre T y F; las fallidas cuentan como frustradas.</p>';

  const pOk = 100 - t.err;
  h += `<h3>Resumen de solicitudes</h3><div class="card"><div class="okko" role="img" aria-label="OK ${f(pOk)} %, KO ${f(t.err)} %">

  h += `<h3>Estadísticas</h3><div class="tabla-wrap"><table><thead><tr><th>Etiqueta</th><th class="n"># Muestras</th><th class="n">KO</th><th class="n">Error %</th>
    <th class="n">Promedio</th><th class="n">Mín</th><th class="n">Máx</th><th class="n">Mediana</th><th class="n">p90</th><th class="n">p95</th><th class="n">p99</th><th class="n">Trans./s</th></tr></thead><tbody>`;
  [...ordenar(c.tabla.map((x) => ({ ...x, name: x.label }))), t].forEach((x) => {
    h += `<tr class="${x.label === 'Total' ? 'total' : ''}"><td class="mono">${esc(x.label)}</td><td class="n">${x.n}</td><td class="n">${x.ko}</td><td class="n">${f(x.err)} %</td>

      <td class="n">${f(x.p95)}</td><td class="n">${f(x.p99)}</td><td class="n">${f(x.tps)}</td></tr>`;
  });
  h += '</tbody></table></div><p class="nota">Tiempos en milisegundos. Percentiles con interpolación lineal sobre todas las solicitudes de la corrida.</p>';

  h += '<h3>Errores</h3>';
  if (!c.errores.length) h += '<p class="vacio">No hubo solicitudes con error en esta corrida.</p>';
  else {
    h += `<div class="tabla-wrap"><table><thead><tr><th>Tipo de error</th><th class="n">Número</th><th class="n">% de los errores</th><th class="n">% de todas las solicitudes</th></tr></thead><tbody>`;
    c.errores.forEach((e) => { h += `<tr><td>${esc(e.tipo)}</td><td class="n">${e.n}</td><td class="n">${f(e.pct_err)} %</td><td class="n">${f(e.pct_total)} %</td></tr>`; });
    h += '</tbody></table></div><h3>Top 5 de errores por endpoint</h3><div class="tabla-wrap"><table><thead><tr><th>Etiqueta</th><th class="n"># Muestras</th><th class="n"># Errores</th>';
    for (let i = 1; i <= 5; i++) h += `<th>Error ${i}</th><th class="n">#</th>`;
    h += '</tr></thead><tbody>';
    c.top.forEach((x) => {
      h += `<tr><td class="mono">${esc(x.label)}</td><td class="n">${x.n}</td><td class="n">${x.ko}</td>`;
      for (let i = 0; i < 5; i++) h += x.top[i] ? `<td>${esc(x.top[i][0])}</td><td class="n">${x.top[i][1]}</td>` : '<td></td><td></td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }

  const id = c.id.replace(/[^a-z0-9-]/gi, '');
  h += '<h3>En el tiempo</h3><div class="graficas">';
  h += graf(`${id}-rt`, 'Tiempo de respuesta en el tiempo', `Promedio por endpoint cada ${c.intervalo} s.`, conColor(c.rt), 'lineas', { xFmt, vFmt: ms, yTitulo: 'ms', xTitulo: 'tiempo transcurrido (mm:ss)', umbral: U.p95 });
  h += graf(`${id}-pct`, 'Percentiles del tiempo de respuesta en el tiempo', `Mediana, p95 y p99 de todas las solicitudes cada ${c.intervalo} s.`, c.pct.map((s, i) => ({ ...s, color: color(i) })), 'lineas', { xFmt, vFmt: ms, yTitulo: 'ms', xTitulo: 'tiempo transcurrido (mm:ss)', umbral: U.p95 });
  h += graf(`${id}-vus`, 'Usuarios virtuales activos', 'Concurrencia aplicada por k6 (equivale a "Active Threads Over Time").', c.vus.map((s) => ({ ...s, color: color(0) })), 'lineas', { xFmt, vFmt: (v) => f(v, 0), yTitulo: 'usuarios', xTitulo: 'tiempo transcurrido (mm:ss)' });
  h += graf(`${id}-tps`, 'Transacciones por segundo', 'Solicitudes completadas por segundo, por endpoint.', conColor(c.tps), 'lineas', { xFmt, vFmt: (v) => f(v) + ' req/s', yTitulo: 'req/s', xTitulo: 'tiempo transcurrido (mm:ss)' });
  h += graf(`${id}-cod`, 'Códigos de respuesta por segundo', 'Respuestas por código HTTP; "Sin respuesta" indica timeout o conexión rechazada.', c.cod.map((s, i) => ({ ...s, color: color(i) })), 'lineas', { xFmt, vFmt: (v) => f(v) + ' /s', yTitulo: 'respuestas/s', xTitulo: 'tiempo transcurrido (mm:ss)' });
  h += '</div><h3>Tiempos de respuesta</h3><div class="graficas">';
  h += graf(`${id}-vsvus`, 'Tiempo de respuesta frente a usuarios activos', 'Promedio por endpoint según cuántos usuarios había activos al llegar la solicitud (equivale a "Time vs Threads"). El punto donde la curva se dispara es el punto de degradación.', conColor(c.rt_vus), 'lineas', { xFmt: (v) => f(v, 0), tipX: (v) => `${f(v, 0)} usuarios activos`, vFmt: ms, yTitulo: 'ms', xTitulo: 'usuarios virtuales activos', umbral: U.p95 });
  h += graf(`${id}-rangos`, 'Solicitudes por rango de tiempo de respuesta', `Equivale a "Response Time Overview": mismos límites del APDEX (T = ${U.apdexT} ms, F = ${U.apdexF} ms).`, c.rangos.map((r) => [r[0], r[1], null, r[2]]), 'barras',
    { xFmt: (v) => v, yTitulo: 'solicitudes', titulo: 'rangos', tip: (d) => `<b>${esc(d[0])}</b>${d[1]} solicitudes (${f(100 * d[1] / c.total.n, 1)} %)` });
  h += graf(`${id}-curva`, 'Percentiles del tiempo de respuesta', 'Qué porcentaje de solicitudes termina por debajo de cada tiempo, por endpoint.', conColor(c.curva), 'lineas', { xFmt: (v) => `p${f(v, 0)}`, vFmt: ms, yTitulo: 'ms', xTitulo: 'percentil', umbral: U.p95 });
  h += graf(`${id}-hist`, 'Distribución del tiempo de respuesta', `Cantidad de solicitudes por rango de ${c.hist_ancho} ms (todos los endpoints).`, c.hist, 'barras',
    { xFmt: (v) => v, yTitulo: 'solicitudes', xTitulo: 'tiempo de respuesta (ms)', tip: (d) => `<b>${d[0]}–${d[0] + c.hist_ancho} ms</b>${d[1]} solicitudes` });
  h += '</div>';
  return h + seccionesE3(c, id);
}

function filasPolitica(p) {
  const fila = (k, v) => v === undefined || v === null ? '' : `<tr><th>${k}</th><td>${esc(v)}</td></tr>`;
  return fila('Autoscaler', p.nombre) + fila('Tamaño mínimo / máximo', `${p.min ?? '?'} / ${p.max ?? '?'}`)
    + fila('Métrica de escalamiento', p.metrica) + fila('Umbral (objetivo de CPU)', p.objetivo !== undefined ? `${f(p.objetivo, 0)} %` : null)
    + fila('Umbral (uso del balanceador)', p.objetivo_lb !== undefined ? `${f(p.objetivo_lb, 0)} %` : null)
    + fila('Período de inicialización (cool down)', p.enfriamiento_s !== undefined ? `${p.enfriamiento_s} s` : null)
    + fila('Modo', p.modo) + fila('Control de reducción', p.control_bajada);
}

function seccionesE3(c, id) {
  const xFmt = reloj, ms = (v) => fms(v) + ' ms', xT = 'tiempo transcurrido (mm:ss)';
  let h = '';
  const M = c.mig;
  if (M) {
    h += '<h3>Autoscaling del MIG</h3>';
    const mk = M.eventos.map((e) => ({ x: e.x, texto: `${e.de}→${e.a}` }));
    h += `<div class="kpis">
      <div class="kpi"><div class="v">${M.inicial ?? '–'} → ${M.maximo ?? '–'}</div><div class="l">Instancias (inicio → máx.)</div></div>
      <div class="kpi"><div class="v">${M.activacion !== null ? reloj(M.activacion) : 'No escaló'}</div><div class="l">Primera activación (mm:ss)</div></div>
      <div class="kpi"><div class="v">${M.activacion !== null && M.primera_lista !== null ? f(M.primera_lista - M.activacion, 0) + ' s' : '–'}</div><div class="l">Activación → 1.ª instancia nueva ${M.hay_lb ? 'saludable' : 'RUNNING'}</div></div>
      <div class="kpi"><div class="v">${M.activacion !== null && M.todas_listas !== null ? f(M.todas_listas - M.activacion, 0) + ' s' : '–'}</div><div class="l">Activación → todas listas</div></div>
      <div class="kpi"><div class="v">${M.reduccion !== null ? reloj(M.reduccion) : '–'}</div><div class="l">Primera reducción (mm:ss)</div></div></div>`;
    if (!M.hay_lb) h += '<p class="aviso">Sin estado del balanceador (BACKEND_SERVICE no definido): "lista" significa RUNNING, que no garantiza que la instancia ya pase el health check.</p>';
    h += '<div class="graficas">';
    const p95 = c.pct.filter((s) => s.name === 'p95').map((s) => ({ ...s, color: 'var(--s1)' }));
    const inst = M.series.map((s, i) => ({ ...s, color: ['var(--s2)', 'var(--s3)', 'var(--s7)'][i], guion: ['', '6 3', '2 2'][i] }));
    h += graf(`${id}-mig`, 'Tiempo de respuesta (p95) e instancias del MIG', `p95 cada ${c.intervalo} s (eje izquierdo) e instancias del grupo leídas cada ${M.intervalo || '?'} s (eje derecho). Las líneas verticales marcan cada cambio del tamaño objetivo.`,
      p95, 'lineas', { xFmt, vFmt: ms, yTitulo: 'p95 (ms)', xTitulo: xT, umbral: U.p95, marcas: mk, ancho: true, alto: 300,
        y2: { series: inst, titulo: 'instancias', minY: (M.politica && M.politica.max) || 3, enteros: true } });
    h += graf(`${id}-mig-vus`, 'Carga aplicada e instancias', 'Usuarios virtuales que k6 necesitó para sostener la tasa (crecen cuando el sistema se pone lento) y tamaño objetivo del MIG.',
      c.vus.map((s) => ({ ...s, color: 'var(--s4)' })), 'lineas', { xFmt, vFmt: (v) => f(v, 0), yTitulo: 'usuarios', xTitulo: xT, marcas: mk,
        y2: { series: inst.slice(0, 1), titulo: 'instancias', minY: (M.politica && M.politica.max) || 3, enteros: true } });
    h += graf(`${id}-mig-err`, 'Errores y throughput durante el escalamiento', 'Respuestas por segundo según código HTTP.', c.cod.map((s, i) => ({ ...s, color: color(i) })), 'lineas',
      { xFmt, vFmt: (v) => f(v) + ' /s', yTitulo: 'respuestas/s', xTitulo: xT, marcas: mk });
    h += '</div>';

    h += `<h3>Tiempo de respuesta por fase del escalamiento</h3><div class="tabla-wrap"><table><thead><tr><th>Fase</th><th>Intervalo (mm:ss)</th><th class="n"># Muestras</th><th class="n">Error %</th>
      <th class="n">Promedio</th><th class="n">Mediana</th><th class="n">p95</th><th class="n">p99</th><th class="n">Trans./s</th><th class="n">APDEX</th></tr></thead><tbody>`;
    M.fases.forEach((x) => {
      h += `<tr><td>${esc(x.fase)}</td><td>${reloj(x.desde)} – ${reloj(x.hasta)}</td><td class="n">${x.n}</td><td class="n">${f(x.err)} %</td><td class="n">${f(x.avg)}</td>
        <td class="n">${f(x.med)}</td><td class="n">${f(x.p95)}</td><td class="n">${f(x.p99)}</td><td class="n">${f(x.tps)}</td><td class="n">${f(x.apdex, 3)}</td></tr>`;
    });
    h += `</tbody></table></div><p class="nota">Fases definidas por los eventos del MIG: activación = primer aumento del tamaño objetivo; "arrancando" termina cuando la primera instancia nueva queda ${M.hay_lb ? 'saludable en el balanceador' : 'RUNNING'}; la reducción es la primera baja del tamaño objetivo.</p>`;

    h += `<h3>Instancias observadas</h3><div class="tabla-wrap"><table><thead><tr><th>Instancia</th><th>Origen</th><th class="n">Aparece</th><th class="n">RUNNING</th>
      ${M.hay_lb ? '<th class="n">Saludable (LB)</th>' : ''}<th class="n">Tiempo hasta operativa</th><th>Al final</th></tr></thead><tbody>`;
    M.instancias.forEach((v) => {
      h += `<tr><td class="mono">${esc(v.nombre)}</td><td>${v.inicial ? 'Existía al inicio' : 'Creada por el autoscaler'}</td><td class="n">${reloj(v.aparece)}</td>
        <td class="n">${v.running !== null ? reloj(v.running) : '–'}</td>${M.hay_lb ? `<td class="n">${v.saludable !== null ? reloj(v.saludable) : '–'}</td>` : ''}
        <td class="n">${v.arranque_s !== null ? v.arranque_s + ' s' : '–'}</td><td>${v.eliminada ? `Eliminada (vista por última vez ${reloj(v.ultima)})` : 'Activa'}</td></tr>`;
    });
    h += `</tbody></table></div><p class="nota">Tiempos relativos al inicio de la prueba, con la resolución del monitor (${M.intervalo || '?'} s). "Tiempo hasta operativa" = desde que la instancia aparece en el MIG hasta que ${M.hay_lb ? 'el balanceador la marca HEALTHY' : 'queda RUNNING'}.</p>`;
    if (M.eventos.length) {
      h += '<h3>Eventos del autoscaler</h3><div class="tabla-wrap"><table><thead><tr><th class="n">Momento (mm:ss)</th><th>Cambio del tamaño objetivo</th></tr></thead><tbody>';
      M.eventos.forEach((e) => { h += `<tr><td class="n">${reloj(e.x)}</td><td>${e.tipo === 'sube' ? '▲ Escala hacia arriba' : '▼ Escala hacia abajo'}: ${e.de} → ${e.a}</td></tr>`; });
      h += '</tbody></table></div>';
    }
  }
  if (c.cpu && c.cpu.length) {
    const obj = M && M.politica && M.politica.objetivo;
    h += '<h3>CPU (Cloud Monitoring)</h3><div class="graficas">';
    h += graf(`${id}-cpu`, 'Utilización de CPU por instancia y de Cloud SQL', `Promedio por minuto. ${obj ? `La línea punteada es el objetivo de CPU del autoscaler (${f(obj, 0)} %).` : ''}`,
      c.cpu.map((s, i) => ({ ...s, color: s.name === 'Cloud SQL' ? 'var(--s8)' : color(i) })), 'lineas',
      { xFmt, vFmt: (v) => f(v, 1) + ' %', yTitulo: '% CPU', xTitulo: xT, minY: 100, umbral: obj, umbralTxt: '%', marcas: M ? M.eventos.map((e) => ({ x: e.x, texto: `${e.de}→${e.a}` })) : null, ancho: true });
    h += '</div>';
  }
  if (c.instancias && c.instancias.length) {
    h += `<h3>Reparto por instancia (balanceador)</h3><div class="tabla-wrap"><table><thead><tr><th>Instancia (X-Instancia)</th><th class="n"># Muestras</th><th class="n">% del total</th>
      <th class="n">Error %</th><th class="n">Promedio</th><th class="n">p95</th><th class="n">Trans./s</th><th class="n">Primera / última (mm:ss)</th></tr></thead><tbody>`;
    c.instancias.forEach((x) => {
      h += `<tr><td class="mono">${esc(x.nombre)}</td><td class="n">${x.n}</td><td class="n">${f(x.pct, 1)} %</td><td class="n">${f(x.err)} %</td><td class="n">${f(x.avg)}</td>
        <td class="n">${f(x.p95)}</td><td class="n">${f(x.tps)}</td><td class="n">${reloj(x.desde)} / ${reloj(x.hasta)}</td></tr>`;
    });
    h += '</tbody></table></div>';
    if (c.instancias.some((x) => x.nombre === 'sin-cabecera')) h += '<p class="aviso">Hay respuestas sin la cabecera X-Instancia: el backend desplegado no la envía. Ver README (sección Entrega 3).</p>';
    h += '<div class="graficas">' + graf(`${id}-inst`, 'Solicitudes por segundo atendidas por cada instancia', 'Muestra cómo el balanceador reparte el tráfico y en qué momento cada instancia nueva empieza a recibirlo.',
      c.inst_tps.map((s, i) => ({ ...s, color: color(i) })), 'lineas', { xFmt, vFmt: (v) => f(v) + ' req/s', yTitulo: 'req/s', xTitulo: xT, ancho: true,
        marcas: M ? M.eventos.map((e) => ({ x: e.x, texto: `${e.de}→${e.a}` })) : null }) + '</div>';
  }
  return h;
}

// ---------- comparativo E2 vs E3 ----------
function vistaComparativo() {
  const B = D.linea_base, ag = D.agregado;
  let h = `<h2>Comparativo Entrega 2 (VM única) vs Entrega 3 (MIG + balanceador)</h2><p class="sub-t">Media ± desviación estándar entre corridas. Línea base: ${esc(B.fuente)}</p>`;
  const metr = [['avg', 'Tiempo promedio (ms)', 1, false], ['p95', 'Percentil 95 (ms)', 1, false], ['p99', 'Percentil 99 (ms)', 1, false],
    ['err', 'Tasa de errores (%)', 2, false], ['tps', 'Throughput (req/s)', 2, true]];
  const pares = [];
  B.filas.forEach((b) => {
    const e = ag.find((a) => a.escenario === b.escenario && a.perfil === b.perfil);
    pares.push({ b, e });
  });
  h += `<div class="tabla-wrap"><table><thead><tr><th>Escenario</th><th>Perfil</th><th>Métrica</th><th class="n">Entrega 2</th><th class="n">Entrega 3</th><th class="n">Cambio</th><th>Umbrales E2 → E3</th></tr></thead><tbody>`;
  pares.forEach(({ b, e }) => {
    metr.forEach(([k, nombre, d, masEsMejor], i) => {
      let cambio = '–', clase = '';
      if (e) {
        if (k === 'err') { const dd = e.err - b.err; cambio = `${dd > 0 ? '+' : ''}${f(dd)} pp`; clase = Math.abs(dd) < 0.005 ? '' : (dd < 0 ? 'mejor' : 'peor'); }
        else if (b[k]) { const pc = 100 * (e[k] - b[k]) / b[k]; cambio = `${pc > 0 ? '+' : ''}${f(pc, 1)} %`; clase = Math.abs(pc) < 1 ? '' : ((pc > 0) === masEsMejor ? 'mejor' : 'peor'); }
      }
      h += `<tr>${i === 0 ? `<td rowspan="5">${esc(NOMBRE_ESC_JS[b.escenario] || b.escenario)}</td><td rowspan="5">${NOMBRE_PERFIL[b.perfil] || b.perfil}</td>` : ''}
        <td>${nombre}</td><td class="n">${f(b[k], d)} ± ${f(b[k + '_sd'], d)}</td><td class="n">${e ? `${f(e[k], d)} ± ${f(e[k + '_sd'], d)}` : '<span class="vacio">sin corridas</span>'}</td>
        <td class="n ${clase}">${cambio}</td>${i === 0 ? `<td rowspan="5">${chip(cumple(b), 'E2 cumple', 'E2 no cumple')}<br>${e ? chip(cumple(e), 'E3 cumple', 'E3 no cumple') : ''}</td>` : ''}</tr>`;
    });
  });
  h += '</tbody></table></div><p class="nota">Cambio: diferencia relativa de E3 respecto de E2 (en puntos porcentuales para la tasa de errores). Verde = mejora; rojo = empeora; sin color = cambio menor al 1 %.</p>';
  const etq = (x) => `${+x.escenario.slice(0, 2)}·${(NOMBRE_PERFIL[x.perfil] || x.perfil).slice(0, 6)}`;
  const barrasPar = (k) => pares.flatMap(({ b, e }) => [[`${etq(b)} E2`, b[k], b, 's2', etq(b)], [`${etq(b)} E3`, e ? e[k] : 0, e || {}, 's1', '']]);
  const tip = (k, u) => (d) => d[2][k] === undefined ? `<b>${esc(d[0])}</b>sin corridas` : `<b>${esc(d[0])}</b>${f(d[1], 1)} ${u} ± ${f(d[2][k + '_sd'], 1)}`;
  h += `<div class="leyenda" style="margin-top:14px"><span><i style="background:var(--s2)"></i>Entrega 2 (VM única)</span><span><i style="background:var(--s1)"></i>Entrega 3 (MIG)</span></div><div class="graficas">`;
  h += graf('cmp-p95', 'p95 por escenario: E2 vs E3', 'La línea punteada es el umbral de aceptación.', barrasPar('p95'), 'barras', { umbral: U.p95, yTitulo: 'ms', tip: tip('p95', 'ms') , etiqueta: true });
  h += graf('cmp-avg', 'Tiempo promedio por escenario: E2 vs E3', 'Promedio de todas las solicitudes.', barrasPar('avg'), 'barras', { yTitulo: 'ms', tip: tip('avg', 'ms') , etiqueta: true });
  h += graf('cmp-tps', 'Throughput por escenario: E2 vs E3', 'Solicitudes por segundo.', barrasPar('tps'), 'barras', { yTitulo: 'req/s', tip: tip('tps', 'req/s') , etiqueta: true });
  h += graf('cmp-err', 'Tasa de errores por escenario: E2 vs E3', 'Porcentaje de solicitudes fallidas.', barrasPar('err'), 'barras', { yTitulo: '%', minY: 1, tip: (d) => `<b>${esc(d[0])}</b>${f(d[1])} %` , etiqueta: true });
  return h + '</div>';
}
const NOMBRE_ESC_JS = { '01-autenticacion': '1 · Autenticación', '02-registro-tareas': '2 · Registro de tareas', '03-vista-profesor': '3 · Vista del profesor', '04-autoscaling': '4 · Autoscaling' };

function menu() {
  let h = '<a href="#resumen" data-id="resumen">Resumen</a>', opciones = '<option value="resumen">Resumen</option>';
  if (D.linea_base) { h += '<a href="#comparativo" data-id="comparativo">Comparativo E2 vs E3</a>'; opciones += '<option value="comparativo">Comparativo E2 vs E3</option>'; }
  let esc0 = '';
  D.corridas.forEach((c) => {
    if (c.escenario !== esc0) { esc0 = c.escenario; h += `<div class="grupo">${esc(c.escenario)}</div>`; }
    h += `<a class="sub" href="#${c.id}" data-id="${c.id}">${NOMBRE_PERFIL[c.perfil] || c.perfil} · ${esc(c.corrida)}</a>`;
    opciones += `<option value="${c.id}">${esc(c.escenario)} · ${NOMBRE_PERFIL[c.perfil] || c.perfil} · ${esc(c.corrida)}</option>`;
  });
  $('#nav').innerHTML = h; $('#menuMovil').innerHTML = opciones;
  $('#menuMovil').addEventListener('change', (e) => { location.hash = e.target.value; });
}

function mostrar() {
  const id = location.hash.slice(1) || 'resumen';
  const c = D.corridas.find((x) => x.id === id);
  dibujos = [];
  const cmp = !c && id === 'comparativo' && D.linea_base;
  $('#vista').innerHTML = c ? vistaCorrida(c) : cmp ? vistaComparativo() : vistaResumen();
  const activo = c ? id : cmp ? 'comparativo' : 'resumen';
  document.querySelectorAll('nav a').forEach((a) => a.classList.toggle('activo', a.dataset.id === activo));
  $('#menuMovil').value = activo;
  dibujos.forEach((d) => d());
  window.scrollTo(0, 0);
}

$('#gen').textContent = `Generado el ${D.generado} a partir de los CSV de k6`;
menu();
window.addEventListener('hashchange', mostrar);
let espera; window.addEventListener('resize', () => { clearTimeout(espera); espera = setTimeout(() => dibujos.forEach((d) => d()), 150); });
mostrar();
</script>
</body>
